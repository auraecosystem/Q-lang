documentation:
  - changed-files:
      - any-glob-to-any-file:
          - "*.md"
          - "Docs/**"
          - "docs/**"

python:
  - changed-files:
      - any-glob-to-any-file:
          - "**/*.py"
          - "pyproject.toml"

ci:
  - changed-files:
      - any-glob-to-any-file:
          - ".github/workflows/**"
          - "bash.sh"
