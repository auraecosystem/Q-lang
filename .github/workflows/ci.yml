name: Q-lang Semantic CI

# Trigger workflow on pushes and pull requests targeting the main branch
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  validate-ecosystem:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.2'
          bundler-cache: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Validate Create -> Validate -> Execute -> Verify
        run: python -m unittest tests/test_semantic_protocol.py

      - name: Make Verification Script Executable
        run: chmod +x ./bash.sh

      - name: Run Core Verification Suite
        run: ./bash.sh
