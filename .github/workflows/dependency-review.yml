# Dependency Review requires GitHub's dependency graph feature to be enabled
# for this repository. Keep it available for manual use until that setting is
# enabled; the unsupported check must not block every pull request.
name: Dependency review (manual)
on:
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

jobs:
  dependency-review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Dependency Review
        uses: actions/dependency-review-action@v4
        with:
          comment-summary-in-pr: always
