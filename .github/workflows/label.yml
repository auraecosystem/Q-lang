# The labeler configuration is introduced on this stabilization branch.
# pull_request_target reads configuration from the base branch, so automatic
# labeling is intentionally manual until this configuration is present on main.
name: Labeler (manual)
on:
  workflow_dispatch:

jobs:
  label:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/labeler@v4
        with:
          repo-token: "${{ secrets.GITHUB_TOKEN }}"
          configuration-path: .github/labeler.yml
