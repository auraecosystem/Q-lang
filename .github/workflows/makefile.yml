name: Experimental Makefile Build (manual)

# This repository does not currently expose the configure/make build contract
# assumed by this historical workflow. Keep it manual until that toolchain is
# added and verified.
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check for configure script
        run: |
          if [ ! -x ./configure ]; then
            echo "No executable ./configure script is present; Makefile build is not configured."
            exit 1
          fi
      - name: Configure and build
        run: |
          ./configure
          make
          make check
