name: Legacy Conda Package Check (manual)

# The project does not currently maintain the environment.yml and pytest
# packaging contract assumed by this historical workflow. The canonical
# Python CI is defined in ci.yml.
on:
  workflow_dispatch:

jobs:
  legacy-conda-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Explain current package validation path
        run: |
          echo "This legacy Conda job is manual-only."
          echo "Use .github/workflows/ci.yml for the supported Python validation."
          echo "Conda packaging will be re-enabled when environment.yml and package tests are maintained."
