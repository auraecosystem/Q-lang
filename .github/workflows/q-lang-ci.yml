name: Q-lang CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile Python sources
        run: python -m compileall Parser Core Runtime q_cli.py
      - name: Run Q-lang tests
        run: python -m unittest discover -s Tests -v
      - name: Execute example
        run: python q_cli.py examples/hello.q
