name: Legacy Q-lang CI (manual)

# The canonical automated test job is ci.yml. Keep this older workflow
# available for manual diagnostics without running a duplicate CI pipeline.
on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Compile active Python sources
        run: python -m compileall -q Parser Core Runtime Protocol Agent q_cli.py
      - name: Run Q-lang tests
        run: python -m unittest discover -s Tests -p "test_*.py" -v
      - name: Execute sample program
        run: python q_cli.py examples/Hello.q
