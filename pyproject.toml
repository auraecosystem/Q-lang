[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "q-lang"
version = "0.1.0"
description = "Universal Semantic Language runtime"
requires-python = ">=3.10"

[project.scripts]
q = "q_cli:main"

[tool.setuptools]
packages = ["Parser", "Core", "Runtime"]
py-modules = ["q_cli"]
